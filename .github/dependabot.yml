version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    cooldown:
      default-days: 1
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    open-pull-requests-limit: 50
    # Exempt onstarjs2 from the default cooldown; all other deps keep the default
    cooldown:
      exclude:
        - "onstarjs2"
        - "update-package-node-red-flow-library-action"
