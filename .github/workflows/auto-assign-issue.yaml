name: Issue assignment

on:
    issues:
        types: [opened]

jobs:
    auto-assign:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: 'Auto-assign issue'
              uses: pozil/auto-assign-issue@bec9ebf443592887b8f9bed643afafdfd3f62f1d # v4.0.2
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: BigThunderSR
                  numOfAssignee: 1
                  allowSelfAssign: false
            
