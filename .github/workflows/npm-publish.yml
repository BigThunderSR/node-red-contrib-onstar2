# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package - Publish to NPM Registry

on:
  release:
    types: [published]
  workflow_dispatch: # To test OIDC publishing without creating a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - run: npm ci
      #- run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - id: publish
        run: npm publish --provenance
        #env:
        #  NODE_AUTH_TOKEN: ${{secrets.npm_token}}        
      - if: steps.publish.outputs.type != 'none'
        name: Update Node-Red flow-library
        uses: BigThunderSR/update-package-node-red-flow-library-action@fc91472a9753be9717747eb4bb09e1e5396e087f # v1.3.22
        continue-on-error: true
        with:
          package-name: 'node-red-contrib-onstar2'
          delay-run-ms: 10000
