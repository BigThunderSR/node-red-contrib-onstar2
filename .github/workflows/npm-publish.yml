# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package - Publish to NPM Registry

on:
  release:
    types: [published]
  workflow_dispatch: # To test OIDC publishing without creating a release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - run: npm ci
      #- run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - id: publish
        run: npm publish --provenance
        #env:
        #  NODE_AUTH_TOKEN: ${{secrets.npm_token}}        
      - if: steps.publish.outputs.type != 'none'
        name: Update Node-Red flow-library
        uses: BigThunderSR/update-package-node-red-flow-library-action@5f3a1ccb22af3c4da201a3d915e355bbfcad7b4f # v1.3.23
        continue-on-error: true
        with:
          package-name: 'node-red-contrib-onstar2'
          delay-run-ms: 300000
